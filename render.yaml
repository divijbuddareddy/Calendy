# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub/GitLab -> Render dashboard -> New -> Blueprint -> pick the repo.
# See docs/OPERATIONS.md for backups, restore drills, monitoring and runbooks.
services:
  - type: web
    name: aal-scheduler
    runtime: python
    plan: starter            # paid instance: free instances sleep, which would pause the reminder/webhook worker
    numInstances: 1          # the background worker runs in-process; see OPERATIONS.md before scaling out
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python seed_prod.py   # idempotent: schema sync + Postgres constraints (+ first owner if SEED_OWNER_* set)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENV
        value: prod
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY      # Fernet key for OAuth tokens/webhook secrets; derived from SECRET_KEY when unset.
        sync: false              # Set it explicitly so SECRET_KEY can be rotated safely (see OPERATIONS.md §6).
      - key: DATABASE_URL
        fromDatabase:
          name: aal-scheduler-db
          property: connectionString
      - key: BASE_URL
        sync: false            # set to https://<your-service>.onrender.com or your custom domain
      - key: WORKER_ENABLED
        value: "true"
      - key: EMBED_ALLOWED_ORIGINS
        value: "*"
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      - key: SEED_OWNER_EMAIL
        sync: false
      - key: SEED_OWNER_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Optional providers (mock mode when unset): GOOGLE_CLIENT_ID/SECRET, MICROSOFT_CLIENT_ID/SECRET,
      # ZOOM_CLIENT_ID/SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, PAYPAL_CLIENT_ID/SECRET,
      # TWILIO_*, SMTP_*, EMAIL_FROM, ANTHROPIC_API_KEY. Add them in the dashboard (sync: false).

databases:
  - name: aal-scheduler-db
    databaseName: scheduler
    user: scheduler
    plan: basic-256mb        # paid plan: daily backups + point-in-time recovery (free Postgres has neither)
    postgresMajorVersion: "16"
    ipAllowList: []          # only Render services in this account can connect
