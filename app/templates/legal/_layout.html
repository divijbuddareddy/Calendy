{% extends "public_base.html" %}
{% block head %}
<style>
  .legal { max-width: 760px; margin: 40px auto; padding: 0 16px; line-height: 1.6; }
  .legal h1 { font-size: 1.8rem; margin-bottom: 4px; }
  .legal h2 { font-size: 1.15rem; margin-top: 28px; }
  .legal .table-wrap { overflow-x: auto; }
  .legal table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  .legal th, .legal td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .legal nav.legal-nav { display: flex; gap: 14px; flex-wrap: wrap; font-size: .9rem; margin-bottom: 18px; }
</style>
{% endblock %}
{% block content %}
<article class="legal">
  <nav class="legal-nav" aria-label="Legal">
    <a href="/">{{ app_name }}</a><a href="/privacy">Privacy notice</a><a href="/terms">Terms</a><a href="/data-retention">Data retention</a>
  </nav>
  {% block legal %}{% endblock %}
  <p class="muted mt">Questions? Contact <a href="mailto:{{ contact }}">{{ contact }}</a>.</p>
</article>
{% endblock %}
