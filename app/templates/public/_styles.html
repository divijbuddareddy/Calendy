<style>
  {% if embed_theme %}:root{ {% for k, v in embed_theme.items() %}{{ k }}: {{ v }};{% endfor %} }
  {% if embed_theme.get('--bg') %}:root{--surface: {{ embed_theme['--bg'] }};}{% endif %}{% endif %}
  body.embedded { background: var(--bg); }
  body.embedded .public-wrap { margin: 0 auto; padding: 0; }
  body.embedded .booking-card { box-shadow: none; }
  .booking-card.no-info { grid-template-columns: 1fr; }
  .host-avatars { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .booking-info h1 { font-size: 1.45rem; margin-top: 4px; }
  .event-desc { white-space: pre-line; margin-top: 14px; color: var(--text); }
  .policy { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); font-size: .88rem; }
  .policy h3 { font-size: .9rem; }
  .pick-grid { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 24px; }
  @media (max-width: 960px) { .pick-grid { grid-template-columns: 1fr; } }
  .cal-head { margin-bottom: 8px; }
  .cal-day { min-height: 38px; }
  .cal-day:disabled { opacity: .55; }
  .cal-day.today { text-decoration: underline; }
  .cal-day:focus-visible { outline: 3px solid var(--primary); outline-offset: 1px; }
  /* server-rendered (no-JS) picker: links/spans styled like the JS buttons */
  a.cal-day, span.cal-day { display: flex; align-items: center; justify-content: center; text-decoration: none; }
  a.cal-day.available { cursor: pointer; }
  a.slot, span.slot { display: block; text-align: center; text-decoration: none; }
  a.slot:hover { text-decoration: none; }
  .slot:focus-visible, .cal-head a:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  .cal-head a[aria-disabled="true"] { opacity: .45; pointer-events: none; }
  .field-error { color: var(--danger); font-weight: 600; }
  .dow abbr { text-decoration: none; }
  .tz-field { margin-top: 16px; }
  .slot-row { display: flex; gap: 6px; }
  .slot-row .slot { flex: 1; }
  .slot small { display: block; font-weight: 500; font-size: .75rem; }
  .slot.full { border-style: dashed; color: var(--muted); border-color: var(--border); }
  .dur-group { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .dur-group .btn[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
  .selected-summary { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; margin: 10px 0 16px; font-weight: 600; }
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  .state { padding: 18px; border-radius: var(--radius-sm); background: var(--surface-2); color: var(--muted); text-align: center; }
  .state.error { background: var(--danger-soft); color: var(--danger); }
  .state.warn { background: var(--warning-soft); color: var(--warning); }
  .req { color: var(--danger); }
  .summary-list { list-style: none; padding: 0; margin: 0 0 16px; }
  .summary-list li { display: flex; gap: 10px; padding: 6px 0; }
  .summary-list li .k { width: 92px; flex-shrink: 0; color: var(--muted); font-weight: 600; font-size: .85rem; }
  .status-hero { text-align: center; padding: 8px 0 16px; }
  .status-hero .icon { font-size: 2.2rem; line-height: 1; }
  .profile-head { text-align: center; padding: 28px 16px 8px; }
  .profile-head .avatar { width: 72px; height: 72px; margin: 0 auto 10px; }
  .event-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .event-list a.card { display: block; color: var(--text); border-top: 4px solid var(--primary); padding: 18px; }
  .event-list a.card:hover { text-decoration: none; box-shadow: var(--shadow-lg); }
  .narrow { max-width: 640px; }
</style>
