{% extends "public_base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="public-wrap" style="max-width:620px">
  <div class="card" style="text-align:center">
    {% if ws %}<p class="muted" style="margin:0">{{ ws.name }}</p>{% endif %}
    <h1>{{ title }}</h1>
    <p style="white-space:pre-line">{{ message }}</p>
  </div>
</div>
{% endblock %}
